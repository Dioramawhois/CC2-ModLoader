[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cc2-mce"
version = "0.4.0b13"
description = "Offline compatibility analysis, verified packaging and activation for CC2 mods"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
    "cryptography==50.0.2",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema>=4.23,<5"]

[project.scripts]
cc2-mce = "cc2_mce.cli:main"

[tool.setuptools.packages.find]
include = ["cc2_mce*"]

[tool.setuptools.package-data]
cc2_mce = ["schemas/*.json", "profiles/*.json", "runtime_data/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["cc2_mce"]
